set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png
loadfont /boot/grub/live-theme/cipher-32.pf2
loadfont /boot/grub/live-theme/cipher-20.pf2
loadfont /boot/grub/live-theme/cipher-18.pf2
loadfont /boot/grub/live-theme/cipher-16.pf2
loadfont /boot/grub/live-theme/cipher-13.pf2

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
